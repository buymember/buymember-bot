<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BuyMember Store</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border-color: #334155;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0; padding: 16px;
      background-color: var(--bg-color);
      color: var(--text-main);
    }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color);
    }
    .logo { font-size: 1.25rem; font-weight: 800; color: var(--accent); }
    .user-pill {
      background: var(--border-color); padding: 4px 10px; border-radius: 9999px;
      font-size: 0.8rem; color: var(--text-muted);
    }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); }
    select, input {
      width: 100%; padding: 12px; border-radius: 8px;
      background: var(--card-bg); border: 1px solid var(--border-color);
      color: var(--text-main); font-size: 0.95rem; outline: none;
    }
    select:focus, input:focus { border-color: var(--accent); }
    .limits { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
    .price-box {
      background: rgba(56, 189, 248, 0.1); border: 1px dashed var(--accent);
      border-radius: 8px; padding: 12px; display: flex;
      justify-content: space-between; align-items: center; margin-bottom: 20px;
    }
    .price-val { font-size: 1.2rem; font-weight: 700; color: var(--accent); }
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 8px;
      background: var(--accent); color: #000; font-weight: 700; font-size: 1rem;
      cursor: pointer; transition: 0.2s;
    }
    .btn:active { background: var(--accent-hover); transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .loading-spinner { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">BuyMember</div>
    <div class="user-pill" id="userDisplay">مهمان</div>
  </div>

  <div class="form-group">
    <label>دسته‌بندی (Category)</label>
    <select id="categorySelect">
      <option value="">در حال دریافت لیست سرویس‌ها...</option>
    </select>
  </div>

  <div class="form-group">
    <label>سرویس (Service)</label>
    <select id="serviceSelect" disabled>
      <option value="">ابتدا دسته‌بندی را انتخاب کنید</option>
    </select>
    <div class="limits">
      <span id="minLimit">حداقل: -</span>
      <span id="maxLimit">حداکثر: -</span>
    </div>
  </div>

  <div class="form-group">
    <label>لینک هدف یا آیدی</label>
    <input type="text" id="targetLink" placeholder="مثال: https://t.me/channel" dir="ltr">
  </div>

  <div class="form-group">
    <label>تعداد (Quantity)</label>
    <input type="number" id="quantityInput" placeholder="100" min="1" dir="ltr">
  </div>

  <div class="price-box">
    <span>مبلغ نهایی تقریبی:</span>
    <span class="price-val" id="totalPrice">$0.00</span>
  </div>

  <button class="btn" id="submitBtn">ثبت سفارش</button>
  <div id="statusText" class="loading-spinner"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      const user = tg.initDataUnsafe?.user;
      if (user) {
        document.getElementById('userDisplay').innerText = user.first_name || user.username || "کاربر";
      }
    }

    // آدرس بک‌اند Render شما:
    const RENDER_BACKEND_URL = "https://buymember-bot.onrender.com";

    let allServices = [];
    let categories = {};
    let selectedService = null;

    const categorySelect = document.getElementById('categorySelect');
    const serviceSelect = document.getElementById('serviceSelect');
    const quantityInput = document.getElementById('quantityInput');
    const targetLink = document.getElementById('targetLink');
    const totalPrice = document.getElementById('totalPrice');
    const minLimit = document.getElementById('minLimit');
    const maxLimit = document.getElementById('maxLimit');
    const submitBtn = document.getElementById('submitBtn');
    const statusText = document.getElementById('statusText');

    // دریافت لیست سرویس‌ها از بک‌اند
    async function loadServices() {
      try {
        statusText.innerText = "در حال بارگذاری سرویس‌ها از سرور...";
        const res = await fetch(`${RENDER_BACKEND_URL}/services`);
        allServices = await res.json();

        if (!Array.isArray(allServices)) {
          throw new Error("داده‌های دریافتی نامعتبر است");
        }

        // گروه‌بندی بر اساس دسته‌بندی
        categories = {};
        allServices.forEach(s => {
          const cat = s.category || "سایر";
          if (!categories[cat]) categories[cat] = [];
          categories[cat].push(s);
        });

        // پر کردن دسته بندی‌ها
        categorySelect.innerHTML = '<option value="">انتخاب دسته‌بندی...</option>';
        Object.keys(categories).forEach(cat => {
          const opt = document.createElement('option');
          opt.value = cat;
          opt.innerText = cat;
          categorySelect.appendChild(opt);
        });

        statusText.innerText = "";
      } catch (err) {
        console.error(err);
        categorySelect.innerHTML = '<option value="">خطا در بارگذاری سرویس‌ها</option>';
        statusText.innerText = "عدم برقراری ارتباط با سرور. لطفا مجدد تلاش کنید.";
      }
    }

    categorySelect.addEventListener('change', (e) => {
      const cat = e.target.value;
      serviceSelect.innerHTML = '<option value="">انتخاب سرویس...</option>';
      selectedService = null;
      calcPrice();

      if (cat && categories[cat]) {
        serviceSelect.disabled = false;
        categories[cat].forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.service;
          opt.innerText = `${s.name} (${s.rate}$ / 1k)`;
          serviceSelect.appendChild(opt);
        });
      } else {
        serviceSelect.disabled = true;
      }
    });

    serviceSelect.addEventListener('change', (e) => {
      const sId = e.target.value;
      selectedService = allServices.find(s => String(s.service) === String(sId));
      if (selectedService) {
        minLimit.innerText = `حداقل: ${selectedService.min}`;
        maxLimit.innerText = `حداکثر: ${selectedService.max}`;
        if (!quantityInput.value || Number(quantityInput.value) < Number(selectedService.min)) {
          quantityInput.value = selectedService.min;
        }
      } else {
        minLimit.innerText = `حداقل: -`;
        maxLimit.innerText = `حداکثر: -`;
      }
      calcPrice();
    });

    quantityInput.addEventListener('input', calcPrice);

    function calcPrice() {
      if (!selectedService || !quantityInput.value) {
        totalPrice.innerText = "$0.00";
        return;
      }
      const qty = parseFloat(quantityInput.value) || 0;
      const rate = parseFloat(selectedService.rate) || 0;
      const cost = (qty / 1000) * rate;
      totalPrice.innerText = `$${cost.toFixed(3)}`;
    }

    submitBtn.addEventListener('click', () => {
      const link = targetLink.value.trim();
      const qty = parseInt(quantityInput.value, 10);

      if (!selectedService) {
        alert("لطفاً یک سرویس انتخاب کنید.");
        return;
      }
      if (!link) {
        alert("لطفاً لینک یا آیدی را وارد کنید.");
        return;
      }
      if (isNaN(qty) || qty < Number(selectedService.min) || qty > Number(selectedService.max)) {
        alert(`تعداد باید بین ${selectedService.min} و ${selectedService.max} باشد.`);
        return;
      }

      const orderData = {
        service: selectedService.service,
        link: link,
        quantity: qty
      };

      if (tg) {
        tg.sendData(JSON.stringify(orderData));
        tg.close();
      } else {
        alert("اطلاعات ثبت شد:\n" + JSON.stringify(orderData, null, 2));
      }
    });

    loadServices();
  </script>
</body>
</html>
