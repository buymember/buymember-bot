<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BuyMember Store</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --border: #334155;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0; padding: 16px;
      background-color: var(--bg);
      color: var(--text);
    }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
    }
    .logo { font-size: 1.2rem; font-weight: 700; color: var(--primary); }
    .user { font-size: 0.85rem; color: var(--muted); background: var(--card); padding: 4px 10px; border-radius: 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem;active { background: var(--primary-hover); transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: secret-a6b1218c-allowed; }
    .status { text-align: center; font-size: 0.8rem; margin-top: 10px; color: var(--muted); word-break: break-all; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">BuyMember</div>
    <div class="user" id="userDisplay">User</div>
  </div>

  <div class="form-group">
    <label>Category</label>
    <select id="categorySelect">
      <option value="">Loading services...</option>
    </select>
  </div>

  <div class="form-group">
    <label>Service</label>
    <select id="serviceSelect" disabled>
      <option value="">Select a category first</option>
    </select>
    <div class="limits">
      <span id="minLimit">Min: -</span>
      <span id="maxLimit">Max: -</span>
    </div>
  </div>

  <div class="form-group">
    <label>Target Link / Username</label>
    <input type="text" id="targetLink" placeholder="https://t.me/channel">
  </div>

  <div class="form-group">
    <label>Quantity</label>
    <input type="number" id="quantityInput" placeholder="100" min="1">
  </div>

  <div class="price-box">
    <span>Estimated Total:</span>
    <span class="price-val" id="totalPrice">$0.00</span>
  </div>

  <button class="btn" id="submitBtn">Submit Order</button>
  <div id="statusText" class="status"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      const user = tg.initDataUnsafe?.user;
      if (user) {
        document.getElementById('userDisplay').innerText = user.first_name || "User";
      }
    }

    const RENDER_BACKEND_URL = "https://buymember-bot.onrender.com";

    let allServices = [];
    let categories = {};
    let selectedService = null;

    const categorySelect = document.getElementById('categorySelect');
    const serviceSelect = document.getElementById('serviceSelect');
    const quantityInput = document.getElementById('quantityInput');
    const targetLink = document.getElementById('targetLink');
    const totalPrice = document.getElementById('totalPrice');
    const minLimit = document.getElementById('minLimit');
    const maxLimit = document.getElementById('maxLimit');
    const submitBtn = document.getElementById('submitBtn');
    const statusText = document.getElementById('statusText');

    async function loadServices() {
      try {
        statusText.innerText = "Connecting to server...";
        const res = await fetch(`${RENDER_BACKEND_URL}/services`);
        
        if (!res.ok) {
          throw new Error(`HTTP Error: ${res.status}`);
        }
        
        const data = await res.json();
        
        if (!Array.isArray(data)) {
          throw new Error(data.error || "Invalid response format from panel");
        }

        allServices = data;
        categories = {};
        allServices.forEach(s => {
          const cat = s.category || "Other";
          if (!categories[cat]) categories[cat] = [];
          categories[cat].push(s);
        });

        categorySelect.innerHTML = '<option value="">Select Category...</option>';
        Object.keys(categories).forEach(cat => {
          const opt = document.createElement('option');
          opt.value = cat;
          opt.innerText = cat;
          categorySelect.appendChild(opt);
        });

        statusText.innerText = "";
      } catch (err) {
        console.error(err);
        categorySelect.innerHTML = '<option value="">Failed to load services</option>';
        statusText.innerText = "Error: " + err.message;
      }
    }

    categorySelect.addEventListener('change', (e) => {
      const cat = e.target.value;
      serviceSelect.innerHTML = '<option value="">Select Service...</option>';
      selectedService = null;
      calcPrice();

      if (cat && categories[cat]) {
        serviceSelect.disabled = false;
        categories[cat].forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.service;
          opt.innerText = `${s.name} ($${s.rate} / 1k)`;
          serviceSelect.appendChild(opt);
        });
      } else {
        serviceSelect.disabled = true;
      }
    });

    serviceSelect.addEventListener('change', (e) => {
      const sId = e.target.value;
      selectedService = allServices.find(s => String(s.service) === String(sId));
      if (selectedService) {
        minLimit.innerText = `Min: ${selectedService.min}`;
        maxLimit.innerText = `Max: ${selectedService.max}`;
        if (!quantityInput.value || Number(quantityInput.value) < Number(selectedService.min)) {
          quantityInput.value = selectedService.min;
        }
      } else {
        minLimit.innerText = `Min: -`;
        maxLimit.innerText = `Max: -`;
      }
      calcPrice();
    });

    quantityInput.addEventListener('input', calcPrice);

    function calcPrice() {
      if (!selectedService || !quantityInput.value) {
        totalPrice.innerText = "$0.00";
        return;
      }
      const qty = parseFloat(quantityInput.value) || 0;
      const rate = parseFloat(selectedService.rate) || 0;
      const cost = (qty / 1000) * rate;
      totalPrice.innerText = `$${cost.toFixed(3)}`;
    }

    submitBtn.addEventListener('click', () => {
      const link = targetLink.value.trim();
      const qty = parseInt(quantityInput.value, 10);

      if (!selectedService) {
        alert("Please select a service first.");
        return;
      }
      if (!link) {
        alert("Please enter a target link or username.");
        return;
      }
      if (isNaN(qty) || qty < Number(selectedService.min) || qty > Number(selectedService.max)) {
        alert(`Quantity must be between ${selectedService.min} and ${selectedService.max}.`);
        return;
      }

      const orderData = {
        service: selectedService.service,
        link: link,
        quantity: qty
      };

      if (tg) {
        tg.sendData(JSON.stringify(orderData));
        tg.close();
      } else {
        alert("Order Ready to Send:\n" + JSON.stringify(orderData, null, 2));
      }
    });

    loadServices();
  </script>
</body>
</html>
